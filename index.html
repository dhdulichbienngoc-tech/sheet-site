<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site từ Google Sheet</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script> <!-- Thư viện parse CSV -->
    <style>
        body { padding: 20px; }
        .nav-link.active { font-weight: bold; }
    </style>
</head>
<body>
    <h1 class="text-center">Dữ liệu từ Google Sheet</h1>
    <ul class="nav nav-tabs" id="sheetTabs">
        <!-- Navigation sẽ được JS thêm động -->
    </ul>
    <div id="tableContainer" class="mt-4"></div>

    <script>
        const sheetNames = ['Blue Ocean Itinerary Price details', 'Northern HOTEL', 'Central HOTEL', 'Southern HOTEL', 'Halong Cruise', 'Restaurant', 'Contact'];
        const csvLinks = [ // THAY BẰNG LINK CSV THỰC CỦA BẠN, THEO THỨ TỰ SHEET NAMES
            'https://docs.google.com/spreadsheets/d/e/2PACX-1vSVY8H9-kxm9ywjaJNbZibgqud97ulwH8V0Q1K3o2ddEihkhJmb5ThXxjJDShJZaeTLQAwOumdB5X1b/pub?gid=1808798930&single=true&output=csv', // Cho sheet 1
            'https://docs.google.com/spreadsheets/d/e/2PACX-1vSVY8H9-kxm9ywjaJNbZibgqud97ulwH8V0Q1K3o2ddEihkhJmb5ThXxjJDShJZaeTLQAwOumdB5X1b/pub?gid=943202508&single=true&output=csv', // Cho sheet 2
            'https://docs.google.com/spreadsheets/d/e/2PACX-1vSVY8H9-kxm9ywjaJNbZibgqud97ulwH8V0Q1K3o2ddEihkhJmb5ThXxjJDShJZaeTLQAwOumdB5X1b/pub?gid=1545924102&single=true&output=csv', // Cho sheet 3
            'https://docs.google.com/spreadsheets/d/e/2PACX-1vSVY8H9-kxm9ywjaJNbZibgqud97ulwH8V0Q1K3o2ddEihkhJmb5ThXxjJDShJZaeTLQAwOumdB5X1b/pub?gid=1159680108&single=true&output=csv', // Cho sheet 4
            'https://docs.google.com/spreadsheets/d/e/2PACX-1vSVY8H9-kxm9ywjaJNbZibgqud97ulwH8V0Q1K3o2ddEihkhJmb5ThXxjJDShJZaeTLQAwOumdB5X1b/pub?gid=315991677&single=true&output=csv', // Cho sheet 5
            'https://docs.google.com/spreadsheets/d/e/2PACX-1vSVY8H9-kxm9ywjaJNbZibgqud97ulwH8V0Q1K3o2ddEihkhJmb5ThXxjJDShJZaeTLQAwOumdB5X1b/pub?gid=116299310&single=true&output=csv', // Cho sheet 6
            'https://docs.google.com/spreadsheets/d/e/2PACX-1vSVY8H9-kxm9ywjaJNbZibgqud97ulwH8V0Q1K3o2ddEihkhJmb5ThXxjJDShJZaeTLQAwOumdB5X1b/pub?gid=1650609520&single=true&output=csv' // Cho sheet 7
        ];

        // Tạo navigation
        const tabs = document.getElementById('sheetTabs');
        sheetNames.forEach((name, index) => {
            const li = document.createElement('li');
            li.className = 'nav-item';
            const a = document.createElement('a');
            a.className = 'nav-link' + (index === 0 ? ' active' : '');
            a.href = '#';
            a.textContent = name;
            a.onclick = () => loadSheet(index);
            li.appendChild(a);
            tabs.appendChild(li);
        });

        // Hàm load dữ liệu sheet từ CSV
        async function loadSheet(sheetIndex) {
            const url = csvLinks[sheetIndex];
            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`Lỗi: ${response.status} - ${response.statusText}`);
                }
                const csvText = await response.text();
                const data = Papa.parse(csvText, {header: false, skipEmptyLines: true}).data; // Parse CSV thành array
                const table = createTable(data);
                document.getElementById('tableContainer').innerHTML = '';
                document.getElementById('tableContainer').appendChild(table);

                // Update active tab
                document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
                document.querySelectorAll('.nav-link')[sheetIndex].classList.add('active');
            } catch (error) {
                document.getElementById('tableContainer').innerHTML = `<p>Lỗi khi load dữ liệu: ${error.message}. Kiểm tra link CSV.</p>`;
            }
        }

        // Tạo bảng từ dữ liệu
        function createTable(data) {
            const table = document.createElement('table');
            table.className = 'table table-striped table-bordered';
            data.forEach((row, i) => {
                const tr = document.createElement('tr');
                row.forEach(cell => {
                    const td = document.createElement(i === 0 ? 'th' : 'td');
                    td.textContent = cell;
                    tr.appendChild(td);
                });
                table.appendChild(tr);
            });
            return table;
        }

        // Load sheet đầu tiên
        loadSheet(0);
    </script>
</body>
</html>
