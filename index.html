<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site từ Google Sheet</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { padding: 20px; }
        .nav-link.active { font-weight: bold; }
    </style>
</head>
<body>
    <h1 class="text-center">Dữ liệu từ Google Sheet</h1>
    <ul class="nav nav-tabs" id="sheetTabs">
        <!-- Navigation sẽ được JS thêm động -->
    </ul>
    <div id="tableContainer" class="mt-4"></div>

    <script>
        const spreadsheetId = '1wI4qZVKpSqsWAW8_bLQAkMlx0nyAhX-k7ZLYBgue8eY';
        const apiKey = 'AIzaSyDfQeTbE4g03IgQ4Txc_895v-T6YOwcf4Q'; // Thay bằng API Key của bạn
        const sheetNames = ['Blue Ocean Intinerary Price details', 'Northern HOTEL ', 'Central HOTEL ', 'Southern HOTEL', 'Halong Cruise', 'Restaurant', 'Contact']; // Thay bằng tên thực của các sheet (lấy từ gid: 1808798930 -> Sheet1, 943202508 -> Sheet2, v.v. Kiểm tra tên sheet)

        // Tạo navigation
        const tabs = document.getElementById('sheetTabs');
        sheetNames.forEach((name, index) => {
            const li = document.createElement('li');
            li.className = 'nav-item';
            const a = document.createElement('a');
            a.className = 'nav-link' + (index === 0 ? ' active' : '');
            a.href = '#';
            a.textContent = name;
            a.onclick = () => loadSheet(name);
            li.appendChild(a);
            tabs.appendChild(li);
        });

        // Hàm load dữ liệu sheet
        async function loadSheet(sheetName) {
            const url = `https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${sheetName}?key=${apiKey}`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                const table = createTable(data.values);
                document.getElementById('tableContainer').innerHTML = '';
                document.getElementById('tableContainer').appendChild(table);

                // Update active tab
                document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
                document.querySelector(`.nav-link[href="#"][textContent="${sheetName}"]`).classList.add('active');
            } catch (error) {
                console.error('Lỗi:', error);
            }
        }

        // Tạo bảng từ dữ liệu
        function createTable(data) {
            const table = document.createElement('table');
            table.className = 'table table-striped table-bordered';
            data.forEach((row, i) => {
                const tr = document.createElement('tr');
                row.forEach(cell => {
                    const td = document.createElement(i === 0 ? 'th' : 'td');
                    td.textContent = cell;
                    tr.appendChild(td);
                });
                table.appendChild(tr);
            });
            return table;
        }

        // Load sheet đầu tiên
        loadSheet(sheetNames[0]);
    </script>
</body>
</html>
