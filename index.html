<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BẢNG GIÁ ĐẠI LÝ BLUE OCEAN TRAVEL 2026</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { padding: 20px; }
        .nav-link.active { font-weight: bold; }
        h1, h2, h3, h4 { color: #333; }
        table { margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1 class="text-center">BẢNG GIÁ ĐẠI LÝ BLUE OCEAN TRAVEL 2026</h1>
    <ul class="nav nav-tabs" id="sheetTabs">
        <!-- Navigation sẽ được JS thêm động -->
    </ul>
    <div id="tableContainer" class="mt-4"></div>

    <script>
        const docId = '1wI4qZVKpSqsWAW8_bLQAkMlx0nyAhX-k7ZLYBgue8eY'; // ID của Google Sheet
        const sheetNames = ['Blue Ocean Itinerary Price details', 'Northern HOTEL', 'Central HOTEL', 'Southern HOTEL', 'Halong Cruise', 'Restaurant', 'Contact']; // Giữ nguyên
        const gids = ['1808798930', '943202508', '1545924102', '1159680108', '315991677', '116299310', '1650609520']; // Giữ nguyên

        // Tạo navigation
        const tabs = document.getElementById('sheetTabs');
        sheetNames.forEach((name, index) => {
            const li = document.createElement('li');
            li.className = 'nav-item';
            const a = document.createElement('a');
            a.className = 'nav-link' + (index === 0 ? ' active' : '');
            a.href = '#';
            a.textContent = name;
            a.onclick = () => loadSheet(index);
            li.appendChild(a);
            tabs.appendChild(li);
        });

        // Hàm load dữ liệu sheet (sử dụng CSV)
        async function loadSheet(sheetIndex) {
            const gid = gids[sheetIndex];
            const url = `https://docs.google.com/spreadsheets/d/${docId}/export?format=csv&gid=${gid}`;
            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`Lỗi: ${response.status} - ${response.statusText}`);
                }
                const csvText = await response.text();
                const tableData = parseCSV(csvText);

                document.getElementById('tableContainer').innerHTML = '';

                if (sheetIndex === 0) {
                    // Render đặc biệt cho tab 1
                    renderCustomTab1(tableData);
                } else {
                    // Render bảng đầy đủ cho các tab khác
                    const table = createTable(tableData);
                    document.getElementById('tableContainer').appendChild(table);
                }

                // Update active tab
                document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
                document.querySelectorAll('.nav-link')[sheetIndex].classList.add('active');
            } catch (error) {
                document.getElementById('tableContainer').innerHTML = `<p>Lỗi khi load dữ liệu: ${error.message}. Kiểm tra quyền share public của sheet.</p>`;
            }
        }

        // Hàm parse CSV thành array 2D
        function parseCSV(csv) {
            const lines = csv.split(/\r?\n/);
            return lines.map(line => line.split(',').map(cell => cell.trim().replace(/^"|"$/g, '')));
        }

        // Hàm render đặc biệt cho tab 1
        function renderCustomTab1(data) {
            const container = document.getElementById('tableContainer');
            container.innerHTML += '<h2>BẢNG GIÁ DÀNH RIÊNG CHO ĐẠI LÝ BLUE OCEAN TRAVEL - 2026</h2>';
            container.innerHTML += '<p>CHỈ DÀNH CHO ĐẠI LÝ - VUI LÒNG KHÔNG CHIA SẺ CÔNG KHAI!</p>';

            let currentRegion = '';
            let currentTour = '';
            let table = null;

            for (let i = 1; i < data.length; i++) { // Bỏ header row
                const row = data[i];
                const region = row[0] || '';
                const tourName = row[1] || '';
                const tourCode = row[2] || '';
                const inclusion = row[3] || '';
                const price = row[4] || '';

                const tourFull = tourName + (tourCode ? ' (Code: ' + tourCode + ')' : '');

                if (region && region !== currentRegion) {
                    if (table) container.appendChild(table);
                    const h2 = document.createElement('h2');
                    h2.textContent = region;
                    container.appendChild(h2);
                    currentRegion = region;
                    currentTour = '';
                }

                if (tourName && tourFull !== currentTour) {
                    if (table) container.appendChild(table);
                    const h3 = document.createElement('h3');
                    h3.textContent = tourFull;
                    container.appendChild(h3);

                    // Thêm Tour Itinerary chỉ cho tour cụ thể
                    if (tourName.toUpperCase().includes('HA NOI DISCOVERY')) {
                        const h4 = document.createElement('h4');
                        h4.textContent = 'Tour Itinerary';
                        container.appendChild(h4);
                        const p = document.createElement('p');
                        p.innerHTML = '<a href="https://drive.google.com/file/d/1W_q_j51gE5JZCGIw7Ak0YfMwlHVveD0_/view?usp=drive_link" target="_blank">Xem chi tiết itinerary (Google Drive)</a>';
                        container.appendChild(p);
                    }

                    // Start new table
                    table = document.createElement('table');
                    table.className = 'table table-striped table-bordered';
                    const thead = document.createElement('thead');
                    thead.innerHTML = '<tr><th>Loại/Item</th><th>Giá (VND)</th></tr>';
                    table.appendChild(thead);
                    currentTour = tourFull;
                }

                // Add row to table nếu có inclusion
                if (table && inclusion) {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>${inclusion}</td><td>${price}</td>`;
                    table.appendChild(tr);
                }
            }

            if (table) container.appendChild(table);
        }

        // Tạo bảng đầy đủ cho các tab khác
        function createTable(data) {
            const table = document.createElement('table');
            table.className = 'table table-striped table-bordered';
            data.forEach((row, i) => {
                const tr = document.createElement('tr');
                row.forEach(cell => {
                    const td = document.createElement(i === 0 ? 'th' : 'td');
                    td.textContent = cell;
                    tr.appendChild(td);
                });
                table.appendChild(tr);
            });
            return table;
        }

        // Load sheet đầu tiên
        loadSheet(0);
    </script>
</body>
</html>
